<body>

    <i class="fa fa-bars"></i>

<div id="vastaus" style="padding-left: 16px;">
</div>

<script>
fetch('https://sakukettunen.github.io/digitekniikat.github.io/palaveri.json')
  .then(function (response) {
    return response.json();
  })
  .then(function (data) {
    kerro(data);
  })
  .catch(function (error) {
    document.getElementById("vastaus").innerHTML =
      "<p>Tietoa ei pystytä hakemaan</p>";
  });

function kerro(data){
  var teksti = "";
  teksti = teksti + "<h1>" + data.agenda + "</h1>";
  teksti = teksti + "<h2>" + data.aihe + "</h2>";
  teksti = teksti + "<p><strong>Osallistujien lukumäärä:</strong> " + data.osallistujien_lukumaarä + "</p>";

  teksti = teksti + "<h3>Osallistujat</h3><ul>";
  for (var i = 0; i < data.osallistujat.length; i++) {
    teksti += "<li>" + data.osallistujat[i] + "</li>";
  }
  teksti = teksti + "</ul>";
  
  teksti = teksti + "<p><strong>Paikka:</strong> " + data.paikka + "</p>";
  teksti = teksti + "<p><strong>Alkamisaika:</strong> " + data.alkamisaika + "</p>";
  teksti = teksti + "<p><strong>Kesto (min):</strong> " + data.kesto_minuutit + "</p>";
  teksti = teksti + "<p><strong>Kesto (ISO):</strong> " + data.kesto_iso + "</p>";

  document.getElementById("vastaus").innerHTML = teksti;
}
</script>


    
</body>
</html>
