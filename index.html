<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tyyli.css">
</head>
<body>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<div class="topnav" id="myTopnav">
  <a href="index.html" class="active">Home</a>
  <a href="digicafe.html">Digi Cafe</a>
  <a href="palaveri.html">Palaveri</a>
  <a href="tyopaikat.html">Työpaikat</a>
  <a href="javascript:void(0);" class="icon" onclick="myFunction()">
    <i class="fa fa-bars"></i>
  </a>
</div>

<div id="vastaus" style="padding-left: 16px;">

</div>

<script>
fetch('https://jaakkola.github.io/json/digitekniikat.json')
// Muunnetaan vastaus JSON muotoon
 .then(function (response) {
return response.json();
})
// Käsitellään muunnettu (eli JSON muotoinen) vastaus
.then(function (responseJson) {
// Testataan onnistuuko json-luku
// Kutsutaan funktiota ja välitetään sille json-vastaus
kerro(responseJson);
})
// Jos tuli jokin virhe
.catch(function (error) {
document.getElementById("vastaus").innerHTML =
"<p>Tietoa ei pystytä hakemaan</p>";
})

function kerro(data){
  var teksti = ""; // määritellään muuttuja, johon tulostettava tieto kerätään
// otsikkotiedon hakeminen ja sijoittaminen h1-elementtiin
teksti = "<h1>" + data.otsikko + "</h1>";
teksti = teksti + "<p>" + data.kuvaus + "</p>";
teksti = teksti + "<p><img src='" + data.kuva + "' alt='kuva digicavesta'></p>"
teksti = teksti + "<h3>Opintojakso " + data.opintojakso.nimi + " " + data.opintojakso.tunnus + " " + data.opintojakso.opintopisteet + " op" + "</h3>";
teksti = teksti + "<ul>";
// tähän tulee muiden tietojen käsittely kohta
// teksti-muuttujan sisällön tulostus
for (var i=0; i<data.sisalto.length; i++){
  teksti = teksti + "<li>" + data.sisalto[i] + "</li>";
}
teksti = teksti + "</ul>";

teksti = teksti + "<h3>Linkit</h3><ul>";
  for (var i=0; i<data.tekniikat.length; i++){
    teksti = teksti + "<li>" + data.tekniikat[i].aihe + "<a href='" + data.tekniikat[i].linkki + "'>" + data.tekniikat[i].linkki + "</a>";
  }

document.getElementById("vastaus").innerHTML = teksti;
}

</script>
    
</body>
</html>
